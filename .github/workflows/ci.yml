name: CI

# Multiplatform build + test matrix. Backs the "multiplatform" claim in the
# README with an actual green build on Linux, Windows and macOS, not just a
# Linux-only smoke test.
#
# Qt is installed via jurplel/install-qt-action, which delegates to
# aqtinstall. The exact addon module names below were verified against the
# real aqt package index for Qt 6.11.1 (`aqt list-qt linux desktop
# --modules 6.11.1 linux_gcc_64`), so they are known to exist for this
# platform/version as of this writing:
#   qt5compat, qtscxml, qtserialport, qtshadertools, qtgraphs, qtquick3d,
#   qtquick3dphysics, qtquicktimeline, qtwebsockets
#
# Notes on module choices:
#   - qtbase, qtdeclarative and qtsvg are NOT addon modules in Qt 6 — they
#     ship as part of the "essential" install and must not be listed here.
#   - There is no standalone "qtstatemachine" addon module. QStateMachine is
#     built from the qtscxml source repository in Qt 6, so `qtscxml` is what
#     provides it.
#   - qtgraphs, qtquick3d, qtquick3dphysics and qtwebsockets are all needed
#     by content added after this workflow was first written
#     (framework-tour/09 and /10, industries/games/kicker,
#     showcases/stock-tracker) — CMake's `find_package(Qt6 COMPONENTS ...)`
#     for every one of these is already optional in this repo, so a missing
#     module on some future platform/version degrades gracefully (that
#     module's app/feature is skipped) rather than failing the whole build.
#   - qtquicktimeline is different from the other add-ons above: it is
#     linked *unconditionally* (no `if(TARGET ...)` guard) by
#     industries/factory/offboard-digital-twin-control-center, since it's
#     present on that app's own local Qt 6.4.2 baseline and is the one
#     load-bearing reason that directory must be GPL-3.0-or-later on every
#     Qt install (see its NOTICE.md) — it must be listed here or CI's build
#     of that app fails outright rather than degrading gracefully.
#     Qt6Quick3DParticles (also used unconditionally by that same app) does
#     not need a separate entry here: it ships as part of the qtquick3d
#     aqt module, not as its own addon.
#   - qtquick3dxr (Qt Quick 3D Xr, used only by the never-built
#     `XrMain.qml` in framework-tour/10) is deliberately NOT listed: it did
#     not appear in the aqt module index checked above, and nothing in this
#     repo's CMake requires it to succeed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.11.1"
  QT_MODULES: "qt5compat qtscxml qtserialport qtshadertools qtgraphs qtquick3d qtquick3dphysics qtquicktimeline qtwebsockets"
  # Runners have no display server; GUI-linked QTest binaries need this to
  # instantiate QApplication/QGuiApplication without a real windowing system.
  QT_QPA_PLATFORM: "offscreen"

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release
